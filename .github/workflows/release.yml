---
name: Release
on:
  push:
    branches: [ "main" ]


jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Ensure Git LFS media
        env:
          GIT_LFS_SKIP_SMUDGE: "0"
        run: |
          git lfs install --local --force
          git lfs fetch --all
          git lfs checkout

      - name: Verify LFS asset
        run: |
          ls -lh white-noise-20m.mp3
          file white-noise-20m.mp3
          if head -n 1 white-noise-20m.mp3 | grep -q "version https://git-lfs.github.com/spec/v1"; then
            echo "::error::white-noise-20m.mp3 is still an LFS pointer"
            exit 1
          fi

      - name: Setup Node.js for semantic-release
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release dependencies
        run: npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with Ruff
        run: ruff check .

      - name: Test with Pytest
        run: pytest

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
