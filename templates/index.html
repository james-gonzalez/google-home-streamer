<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Google Home Streamer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app-shell container">
      <div class="card shadow-lg glassy">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <div class="eyebrow">Google Home Streamer</div>
              <h1 class="h4 fw-bold mb-0">White Noise</h1>
            </div>
            <span class="badge text-bg-success" id="device-count">0 found</span>
          </div>

          <div class="status-pill mb-3">
            <div>
              <div class="label">Now playing</div>
              <div class="value" id="now-playing">Nothing playing</div>
            </div>
            <div>
              <div class="label">Volume</div>
              <div class="value" id="now-volume">--%</div>
            </div>
          </div>

          <div class="mb-3">
            <label for="devices" class="form-label">Speaker</label>
            <div class="input-group input-group-lg">
              <select class="form-select" id="devices"></select>
              <button class="btn btn-outline-light" id="refresh" type="button">Refresh</button>
            </div>
          </div>

          <div class="control-grid">
            <button class="btn btn-primary btn-lg control-btn" id="play">
              <span class="icon">▶</span>
              <span>Start</span>
            </button>
            <button class="btn btn-secondary btn-lg control-btn" id="stop">
              <span class="icon">■</span>
              <span>Stop</span>
            </button>
            <button class="btn btn-outline-light btn-lg control-btn" id="volume-down">
              <span class="icon">−</span>
              <span>Vol Down</span>
            </button>
            <button class="btn btn-outline-light btn-lg control-btn" id="volume-up">
              <span class="icon">+</span>
              <span>Vol Up</span>
            </button>
          </div>

          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="loop" checked />
            <label class="form-check-label" for="loop">Loop playback</label>
          </div>

          <div id="status" class="text-center text-muted mt-2 small"></div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="/static/script.js"></script>
  </body>
</html>
